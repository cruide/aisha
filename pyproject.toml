[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aisha"
version = "0.1.0"
description = "Local console AI agent for working with source code, files, CLI and internet"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "prompt-toolkit>=3.0",
    "ddgs>=9.0",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
aisha = "aisha.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
